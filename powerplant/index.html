<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a08">
  <meta name="description" content="DoobieLandia — POWERPLANT hemp. Instagram, catalog, and Telegram.">
  <title>DoobieLandia · POWERPLANT hemp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0b0a08;
      --ink-2: #14120f;
      --gold: #c9a24d;
      --gold-soft: #e4c98a;
      --gold-dim: rgba(201, 162, 77, 0.22);
      --line: rgba(201, 162, 77, 0.28);
      --text: #f3ead6;
      --muted: #9a907c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: radial-gradient(1200px 700px at 50% -10%, #1c1812 0%, var(--ink) 55%);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 48px 16px 56px;
    }

    .wrap {
      width: 100%;
      max-width: 430px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 34px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .sub {
      margin-top: 8px;
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .stack { display: grid; gap: 10px; }

    a.btn {
      min-height: 56px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #17150f, var(--ink-2));
      color: var(--text);
      text-decoration: none;
    }

    a.btn:hover,
    a.btn:focus-visible {
      border-color: var(--gold);
    }

    .btn strong {
      display: block;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>DoobieLandia</h1>
      <p class="sub">POWERPLANT · hemp</p>
    </header>

    <div class="stack">
      <a class="btn" href="https://www.instagram.com/powerplantog/" target="_blank" rel="noopener noreferrer">
        <strong>Instagram</strong>
        <span class="meta">@powerplantog</span>
      </a>
      <a class="btn" href="https://windy-apple-20f.notion.site/DOOBIELANDIA-3ad837bd73a98035abbbc29ae2894653" target="_blank" rel="noopener noreferrer">
        <strong>Catalog</strong>
        <span class="meta">Notion</span>
      </a>
      <a class="btn" href="https://t.me/+gdidBSM9muRkN2Rh" target="_blank" rel="noopener noreferrer">
        <strong>Telegram</strong>
        <span class="meta">channel</span>
      </a>
    </div>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a08">
  <meta name="description" content="Grok Girl — comedy and film. GROKKY BEAR is the teddy, part of Grok Girl.">
  <title>Grok Girl · Comedy / Film</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0b0a08;
      --gold: #c9a24d;
      --gold-soft: #e4c98a;
      --gold-dim: rgba(201, 162, 77, 0.22);
      --line: rgba(201, 162, 77, 0.28);
      --text: #f3ead6;
      --muted: #9a907c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: radial-gradient(1000px 640px at 50% -8%, #1c1812 0%, var(--ink) 58%);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 36px 16px 56px;
    }

    .wrap {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .back {
      display: inline-block;
      margin-bottom: 28px;
      color: var(--gold);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .stage {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #16140f, #100e0b);
      border-radius: 22px;
      padding: 36px 22px 32px;
    }

    .marks {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 22px;
    }

    .gg {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      box-shadow: 0 0 0 6px var(--gold-dim);
      display: grid;
      place-items: center;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 26px;
      letter-spacing: 0.08em;
      color: var(--gold-soft);
    }

    .teddy {
      width: 88px;
      height: 88px;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 40px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .kicker {
      margin-top: 8px;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    p {
      margin: 16px auto 0;
      max-width: 34ch;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .note {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--text);
      font-size: 13px;
      letter-spacing: 0.03em;
    }

    .note strong {
      color: var(--gold-soft);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="/links/">← Back to links</a>
    <section class="stage">
      <div class="marks">
        <div class="gg" aria-hidden="true">GG</div>
        <svg class="teddy" viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GROKKY BEAR, a simple teddy mark">
          <circle cx="22" cy="20" r="11" stroke="#c9a24d" stroke-width="1.6"/>
          <circle cx="66" cy="20" r="11" stroke="#c9a24d" stroke-width="1.6"/>
          <circle cx="44" cy="42" r="24" stroke="#c9a24d" stroke-width="1.6"/>
          <circle cx="44" cy="58" r="16" stroke="#e4c98a" stroke-width="1.4"/>
          <circle cx="36" cy="38" r="2.2" fill="#e4c98a"/>
          <circle cx="52" cy="38" r="2.2" fill="#e4c98a"/>
          <ellipse cx="44" cy="46" rx="3.2" ry="2.4" stroke="#c9a24d" stroke-width="1.3"/>
          <path d="M41 50c2 2.4 4 2.4 6 0" stroke="#c9a24d" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="kicker">Comedy / Film</p>
      <h1>Grok Girl</h1>
      <p>A placeholder for the Grok Girl comedy and film world. More scenes, shorts, and mischief are on the way.</p>
      <p class="note"><strong>GROKKY BEAR</strong> is the teddy — part of Grok Girl, not a separate act.</p>
    </section>
  </main>
</body>
</html>
